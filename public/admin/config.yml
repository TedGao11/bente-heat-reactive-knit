# ============================================================
# Decap CMS 后台配置 (/admin)
#
# 建站脚本会尝试自动替换 repo / site_url / base_url。
# ⚠️ YAML 只能用空格缩进，绝对不能用 Tab。
# ============================================================

backend:
  name: github
  repo: TedGao11/bente-heat-reactive-knit        # ← 你的用户名/仓库名
  branch: main

publish_mode: simple

# 登录网关（所有站共用同一个，部署一次即可，见 docs/02）
base_url: https://YOUR-OAUTH-GATEWAY.vercel.app
auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://benteheatknit.com
display_url: https://benteheatknit.com

collections:
  # ---------- 产品：一个文件 = 一个产品页 ----------
  - name: products
    label: 产品
    label_singular: 产品
    folder: content/products
    create: true
    delete: true
    slug: "{{fields.slug}}"
    preview_path: "products/{{slug}}"
    summary: "{{title}} — {{summary}}"
    fields:
      - { label: 文件名(slug), name: slug, widget: string, hint: "小写字母、数字、连字符，例：product-01" }
      - { label: 产品名, name: title, widget: string }
      - { label: 一句话简介, name: summary, widget: text, hint: "显示在产品卡片和 Google 结果里" }
      - { label: 主图, name: image, widget: image, required: false }
      - { label: 排序, name: order, widget: number, default: 10, value_type: int }
      - { label: SEO 关键词, name: keywords, widget: list, required: false, default: [] }
      - label: 规格参数
        name: specs
        widget: list
        required: false
        fields:
          - { label: 参数名, name: label, widget: string }
          - { label: 参数值, name: value, widget: string }
      - { label: 正文, name: body, widget: markdown }

  # ---------- 单页 ----------
  - name: pages
    label: 单页
    files:
      - label: 关于我们
        name: about
        file: content/pages/about.md
        fields:
          - { label: SEO 标题, name: title, widget: string }
          - { label: SEO 描述, name: description, widget: string, required: false }
          - { label: 正文, name: body, widget: markdown }
